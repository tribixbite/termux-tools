[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-dlp-threads"
version = "0.1.0"
description = "yt-dlp extractor plugin for Threads (threads.com / threads.net)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Unlicense" }
authors = [{ name = "tribixbite" }]
keywords = ["yt-dlp", "yt-dlp-plugin", "threads", "instagram", "downloader"]
dependencies = ["yt-dlp"]

[project.urls]
Homepage = "https://github.com/tribixbite/yt-dlp-threads"
Issues = "https://github.com/tribixbite/yt-dlp-threads/issues"

# yt_dlp_plugins is a PEP 420 implicit namespace package (no __init__.py).
[tool.setuptools.packages.find]
include = ["yt_dlp_plugins*"]
namespaces = true
