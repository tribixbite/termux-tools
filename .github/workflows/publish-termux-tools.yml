name: Publish termux-tools

# Publishes claude-channel/ (ccx + cdx + agx + Termux shell tools) to npm as
# `termux-tools`. Triggered by a `termux-tools-v<version>` tag whose version
# must match claude-channel/package.json, or manually (dry run by default).
on:
  push:
    tags: ['termux-tools-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: true

permissions:
  contents: write   # GitHub release on termux-tools-v* tags
  id-token: write   # OIDC trusted publisher (npm)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-channel
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build CLIs and stage shell tools
        run: bun run build

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/termux-tools-v')
        run: |
          TAG="${GITHUB_REF_NAME#termux-tools-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag version $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (Node 24) is required for OIDC trusted publishing;
          # Node 22's npm 10 silently falls back to token auth and ENEEDAUTHs.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -qiE '\.pem|\.env|node_modules' /tmp/pack-output.txt; then
            echo "refusing to publish: unexpected files in tarball" >&2
            exit 1
          fi
          echo "### Package contents" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pack-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether this version is already on npm
        id: published
        working-directory: claude-channel
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "termux-tools@$V" version >/dev/null 2>&1; then
            echo "termux-tools@$V is already published; npm publish will be skipped"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publisher / OIDC)
        if: ${{ !inputs.dry_run && steps.published.outputs.exists != 'true' }}
        # No NODE_AUTH_TOKEN on purpose: npm uses the GitHub OIDC token against the
        # trusted publisher configured for `termux-tools` on npmjs.com. The first
        # version of a package cannot use OIDC and was published manually.
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/termux-tools-v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: termux-tools ${{ github.ref_name }} (ccx, cdx, agx)
          generate_release_notes: true
